<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hay un impostor en Bulevares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>HAY UN IMPOSTOR<br>EN BULEVARES</h1>
            <p class="subtitle">¡EXPONGAMOS A JORGE!</p>
        </header>

        <main id="screen-login" class="setup-box">
            <div class="panel-settings">
                <h3 class="panel-title">CONFIGURACIÓN DE PARTIDA</h3>
                <div class="stepper-group">
                    <label>CANTIDAD DE JUGADORES:</label>
                    <div class="stepper">
                        <button class="step-btn" onclick="changeValue('players', -1)">-</button>
                        <span id="val-players" class="step-value">15</span>
                        <button class="step-btn" onclick="changeValue('players', 1)">+</button>
                    </div>
                </div>
                <div class="stepper-group">
                    <label>MÁXIMO DE IMPOSTORES:</label>
                    <div class="stepper">
                        <button class="step-btn" onclick="changeValue('impostors', -1)">-</button>
                        <span id="val-impostors" class="step-value">7</span>
                        <button class="step-btn" onclick="changeValue('impostors', 1)">+</button>
                    </div>
                </div>
            </div>
            <div class="action-buttons">
                <button id="btn-create" class="btn-primary">CREAR SALA</button>
                <div class="divider"><span>o</span></div>
                <div class="join-group">
                    <input type="text" id="room-code" placeholder="Código..." maxlength="6">
                    <button id="btn-join" class="btn-secondary">UNIRSE</button>
                </div>
            </div>
        </main>

        <main id="screen-lobby" class="setup-box hidden">
            <div class="lobby-header">
                <p class="lobby-label">CÓDIGO DE ACCESO</p>
                <h2 id="display-room-code" class="highlight-text">------</h2>
            </div>
            <div id="players-grid" class="players-grid"></div>
            <div class="action-buttons">
                <button id="btn-start" class="btn-primary">INICIAR PARTIDA</button>
                <button onclick="location.reload()" class="btn-secondary">SALIR</button>
            </div>
        </main><div id="modal-name" class="modal hidden">
    <div class="setup-box modal-content">
        <h3 class="panel-title">IDENTIFÍCATE</h3>
        <div class="input-group">
            <input type="text" id="player-name-input" placeholder="Feliche..." maxlength="15">
        </div>
        <button id="btn-confirm-name" class="btn-primary">CONFIRMAR</button>
        <button onclick="closeModal()" class="btn-secondary" style="margin-top: 10px; width: 100%;">CANCELAR</button>
    </div>
</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
